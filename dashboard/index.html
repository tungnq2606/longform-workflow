<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--card:#fff;--line:#E1E4E8;--soft:#EEF0F3;--ink:#15171A;--ink2:#3A3F47;--mute:#5B616B;--input:#D5D9E0;--hover:#ECEEF2;--well:#F6F7F9;--slot:#F8F9FB;--dash:#B9C0CB;--acc:#2F5BEA;--accbg:#E8EEFF;--accink:#1D3FB8;--ok:#1F7A4D;--okbg:#E7F3EC;--warn:#B4430C;--warnbg:#FCE9DE;--link:#2448C8;color-scheme:light}
:root[data-theme="dark"]{--bg:#111316;--card:#1A1D21;--line:#2C3036;--soft:#23272C;--ink:#E8EAED;--ink2:#C4C8CE;--mute:#9AA1AB;--input:#3A3F47;--hover:#262A30;--well:#14171A;--slot:#16191D;--dash:#4A505A;--acc:#4C74F0;--accbg:#1E2A4D;--accink:#AFC3FF;--ok:#5BC08B;--okbg:#17301F;--warn:#F08A55;--warnbg:#3A2216;--link:#8FB0FF;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--card:#1A1D21;--line:#2C3036;--soft:#23272C;--ink:#E8EAED;--ink2:#C4C8CE;--mute:#9AA1AB;--input:#3A3F47;--hover:#262A30;--well:#14171A;--slot:#16191D;--dash:#4A505A;--acc:#4C74F0;--accbg:#1E2A4D;--accink:#AFC3FF;--ok:#5BC08B;--okbg:#17301F;--warn:#F08A55;--warnbg:#3A2216;--link:#8FB0FF;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif}
a{color:var(--link)}
.app{display:flex;min-height:100vh}
nav{width:240px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{font-weight:700;font-size:16px;padding:2px 12px 16px}
nav label{font-size:12px;color:var(--mute);padding:0 12px}
nav select{margin:6px 6px 14px;min-height:40px;border:1px solid var(--input);border-radius:8px;padding:0 10px;font:inherit;background:var(--card)}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink2);text-decoration:none}
nav a:hover{background:var(--hover)}
nav a.on{background:var(--accbg);color:var(--accink);font-weight:600}
nav .sec{font-size:12px;color:var(--mute);padding:16px 12px 6px}
nav .dis{color:var(--mute);pointer-events:none}
main{flex:1;min-width:0;padding:26px 32px calc(var(--dockh,42vh) + 30px)}
h1{margin:0;font-size:24px}
h2{margin:0 0 10px;font-size:16px}
.sub{color:var(--mute);margin:4px 0 0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--input);background:var(--card);color:var(--ink);font:500 13px 'IBM Plex Sans',sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--well)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:6px;font:12px 'IBM Plex Mono',monospace;background:var(--soft);color:var(--ink2)}
.chip.done,.chip.ready,.chip.approved{background:var(--okbg);color:var(--ok)}
.chip.todo,.chip.pending{background:var(--soft);color:var(--mute)}
.chip.failed,.chip.check_failed{background:var(--warnbg);color:var(--warn)}
.chip.needs_approval,.chip.running{background:var(--accbg);color:var(--accink)}
.grid{display:grid;gap:14px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--soft);vertical-align:top}
pre,.mono{font:12.5px/1.6 'IBM Plex Mono',monospace}
pre{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;margin:0;max-height:260px;overflow:auto}
textarea,input[type=text]{width:100%;border:1px solid var(--input);border-radius:8px;padding:10px 12px;font:13px/1.6 'IBM Plex Mono',monospace;background:var(--card);color:var(--ink)}
textarea:focus,input:focus,select:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.shot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.1fr);gap:16px}
.shot.shorts-shot{grid-template-columns:minmax(0,.95fr) minmax(0,1.35fr) minmax(0,1.4fr)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer}
.thumbs img.portrait{width:76px;aspect-ratio:9/16}
.thumbs img.sel{border-color:var(--acc)}
.big{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--slot)}
.big.portrait,.slot.portrait{aspect-ratio:9/16;max-width:210px;margin:0 auto;width:100%}
.slot{display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px dashed var(--dash);border-radius:10px;background:var(--slot);color:var(--mute);font-size:12px;aspect-ratio:16/9;padding:8px}
.slot.drag{border-color:var(--acc);background:var(--accbg)}
.media-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.media-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.media-col .lbl{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.vclip{width:100%;max-width:210px;aspect-ratio:9/16;margin:0 auto;border-radius:10px;border:1px solid var(--line);background:#000;object-fit:cover;display:block}
.vrender-916{width:100%;max-width:340px;aspect-ratio:9/16;margin:10px auto 0;display:block;border-radius:12px;background:#000}
.cover-preview{width:100%;max-width:240px;aspect-ratio:9/16;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#000;display:block}
.board{display:grid;grid-template-columns:repeat(7,minmax(160px,1fr));gap:10px;overflow-x:auto}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:block;color:inherit;text-decoration:none}
.vcard:hover{border-color:var(--acc)}
.dock{position:fixed;left:240px;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:0;height:var(--dockh,42vh);z-index:5}
.grip{position:absolute;left:0;right:0;top:-5px;height:10px;cursor:ns-resize;z-index:6}
.grip::after{content:"";position:absolute;left:50%;top:3px;width:48px;height:4px;margin-left:-24px;border-radius:2px;background:var(--dash)}
.dsize{display:inline-flex;gap:4px}
.dsize button{min-height:26px;padding:0 8px;border:1px solid var(--input);background:var(--card);color:var(--ink2);border-radius:6px;font:12px 'IBM Plex Sans',sans-serif;cursor:pointer}
.msg{font-size:14px;line-height:1.6}
.dock>div{padding:10px 16px;overflow:auto;min-width:0}
.dock .claude{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:13px}
.msg{padding:6px 10px;border-radius:8px;background:var(--well);white-space:pre-wrap}
.msg.owner{background:var(--accbg);align-self:flex-end;max-width:85%}
.msg.gemini{border-left:3px solid var(--ok)}.msg.claude{border-left:3px solid var(--acc)}
.msg .who{font-size:11px;color:var(--mute);display:block}
.pick{min-height:28px;border:1px solid var(--input);border-radius:6px;background:var(--card);color:var(--ink);font:12px 'IBM Plex Sans',sans-serif;padding:0 6px}
.joblog{white-space:pre-wrap;font:12px/1.5 'IBM Plex Mono',monospace;color:var(--ink2)}
.job{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.muted{color:var(--mute)}
.err{color:var(--warn)}
details summary{cursor:pointer;color:var(--accink);font-size:13px}
.btn.busy{opacity:1;background:var(--accbg);border-color:var(--acc);color:var(--accink);cursor:progress}
.btn.busy::before,.spin::before{content:"";width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn.busy::before,.spin::before{animation:none}}
#runbar{position:sticky;top:0;z-index:4;margin:-26px -32px 18px;padding:0 32px}
#runbar .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accbg);color:var(--accink);border-bottom:1px solid var(--acc);padding:8px 14px;font-size:13px}
#runbar .bar span{display:inline-flex;gap:6px;align-items:center}
#toasts{position:fixed;right:18px;bottom:280px;z-index:9;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:13px;max-width:360px}
.toast.bad{border-left-color:var(--warn)}
.alert{border:1px solid var(--warn);background:var(--warnbg);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.alert h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
.alert ul{margin:0;padding-left:18px}.alert li{margin:3px 0}
.alert.info{border-color:var(--acc);background:var(--accbg)}.alert.info h3{color:var(--accink)}
.need{border:2px solid var(--warn)!important}
.badge-need{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:6px;background:var(--warn);color:#fff;font-size:12px;font-weight:600}
.jump{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.jump a{display:inline-flex;align-items:center;min-height:26px;padding:0 7px;border-radius:6px;font:11px 'IBM Plex Mono',monospace;text-decoration:none;background:var(--soft);color:var(--ink2);border:1px solid transparent}
.jump a.ok{background:var(--okbg);color:var(--ok)}.jump a.need{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.jump a.bad{background:var(--warn);color:#fff}.jump a.wait{background:var(--accbg);color:var(--accink)}
.jump a.clipdone{background:var(--ok);color:#fff;font-weight:600}.jump a.clipwork{background:var(--accbg);color:var(--accink);border:1px dashed var(--acc)}
.jump a.clipask{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.shot.clip-done{border-left:4px solid var(--ok)}.shot.clip-work{border-left:4px solid var(--acc)}.shot.clip-ask{border-left:4px solid var(--warn)}
.chip.clipdone{background:var(--ok);color:#fff}.chip.clipask{background:var(--warnbg);color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin:-6px 0 12px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.flash{animation:fl 1.6s ease-out}@keyframes fl{0%{box-shadow:0 0 0 4px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{min-height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--input);background:var(--card);color:var(--ink2);font:500 13px 'IBM Plex Sans',sans-serif;cursor:pointer}
.tabs button.on{background:var(--accbg);color:var(--accink);border-color:var(--acc)}
#totop{position:fixed;right:22px;bottom:calc(var(--dockh,42vh) + 18px);z-index:7;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
#totop.show{opacity:1;pointer-events:auto;transform:none}
@media (prefers-reduced-motion:reduce){#totop{transition:none}}
.nextrow>td{background:var(--well);border-top:0}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.steps a{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);text-decoration:none;font-size:12px}
.steps a .n{font:11px 'IBM Plex Mono',monospace;color:var(--mute)}
.steps a.done{background:var(--okbg);border-color:transparent;color:var(--ok)}
.steps a.cur{border-color:var(--acc);background:var(--accbg);color:var(--accink);font-weight:600}
.steps a.opt{border-style:dashed}
.nextcard{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.nextcard .who{font:12px 'IBM Plex Mono',monospace;color:var(--mute)}
.nextbox{padding:6px 2px 4px}
.nextgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.step .btn{align-self:flex-start;margin-top:auto}
@media (max-width:1100px){.nextgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){nav{display:none}.dock{left:0;grid-template-columns:1fr;height:auto;max-height:50vh}.shot{grid-template-columns:1fr}main{padding:18px 16px 380px}}
video{background:#000}
.theme{display:flex;gap:4px;margin:auto 6px 0;padding-top:16px}.theme button{flex:1;min-height:32px;border:1px solid var(--input);background:var(--card);color:var(--ink2);border-radius:8px;font:12px 'IBM Plex Sans',sans-serif;cursor:pointer}.theme button.on{background:var(--accbg);color:var(--accink);border-color:var(--acc)}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Điều hướng">
    <div class="brand">Studio</div>
    <label for="ch">Kênh</label>
    <select id="ch"></select>
    <a href="#board" data-r="board">Bảng video</a>
    <a href="#topics" data-r="topics">Tìm chủ đề</a>
    <a href="/office">Văn phòng 3D</a>
    <div class="sec" id="vlabel">Chưa mở video</div>
    <a data-t="script">Kịch bản và nguồn</a>
    <a data-t="characters">Nhân vật và style</a>
    <a data-t="shots">Phân cảnh và ảnh</a>
    <a data-t="voice">Giọng đọc</a>
    <a data-t="preview">Xem trước và dựng</a>
    <a data-t="upload">Đăng</a>
    <div class="theme" role="group" aria-label="Giao diện"><button type="button" data-theme-set="auto">Tự động</button><button type="button" data-theme-set="light">Sáng</button><button type="button" data-theme-set="dark">Tối</button></div>
  </nav>
  <main><div id="runbar" aria-live="polite"></div><div id="guide"></div><div id="view"></div></main>
  <div id="toasts" aria-live="polite"></div>
  <button type="button" id="totop" aria-label="Lên đầu trang">Lên đầu trang</button>
</div>
<div class="dock">
  <div class="grip" id="grip" title="Kéo để đổi chiều cao" aria-hidden="true"></div>
  <div class="claude">
    <div class="row" style="justify-content:space-between"><b>Trợ lý</b><span class="row" style="gap:10px"><span class="muted" id="cscope"></span>
      <span class="dsize" role="group" aria-label="Chiều cao khung trợ lý"><button type="button" data-dh="22">Thấp</button><button type="button" data-dh="42">Vừa</button><button type="button" data-dh="70">Cao</button></span></span></div>
    <div class="msgs" id="msgs"></div>
    <div class="row" style="gap:6px;font-size:12px">
      <label class="muted" for="cmodel">Claude</label>
      <select id="cmodel" class="pick"><option value="">mặc định (Opus)</option><option value="opus">Opus 5.5</option><option value="sonnet">Sonnet 5.5</option><option value="haiku">Haiku 5.5</option></select>
      <label class="muted" for="ceffort">effort</label>
      <select id="ceffort" class="pick"><option value="">mặc định (high)</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select>
      <label class="muted" for="gmodel" style="margin-left:8px">Gemini</label>
      <select id="gmodel" class="pick"><option value="gemini-4-argon-high">4 Argon high</option><option value="gemini-4-argon-medium">4 Argon medium</option><option value="gemini-4-argon-low">4 Argon low</option><option value="gemini-3.8-flash-high">3.8 Flash high</option><option value="gemini-3.8-flash-medium">3.8 Flash medium</option><option value="gemini-3.8-flash-low">3.8 Flash low</option></select>
    </div>
    <form id="cform" class="row" style="flex-wrap:nowrap">
      <label for="cmsg" class="muted" style="position:absolute;left:-9999px">Yêu cầu cho Claude</label>
      <textarea id="cmsg" rows="2" placeholder="Gemini: tìm chủ đề, nghiên cứu, gom nguồn. Claude: kịch bản, chia cảnh và prompt ảnh, sửa và dựng video."></textarea>
      <div style="display:flex;flex-direction:column;gap:4px"><button class="btn" type="submit" data-who="gemini" data-busy="gemini" title="Tốn quota Google, không tốn quota Claude">Gửi Gemini</button><button class="btn pri" type="submit" data-who="claude" data-busy="claude">Gửi Claude</button></div>
    </form>
  </div>
  <div>
    <div class="row" style="justify-content:space-between"><b>Việc đang chạy</b><span class="muted" id="jcount"></span></div>
    <div id="jobs"></div>
    <div id="jobview" class="joblog"></div>
  </div>
</div>
<script>
(function () {
  const apply = m => { if (m === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', m);
    document.querySelectorAll('[data-theme-set]').forEach(b => b.classList.toggle('on', b.dataset.themeSet === m)); };
  let m = 'auto'; try { m = localStorage.getItem('theme') || 'auto'; } catch (e) {}
  apply(m);
  document.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => { try { localStorage.setItem('theme', b.dataset.themeSet); } catch (e) {} apply(b.dataset.themeSet); });
})();
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const file = p => '/file?path=' + encodeURIComponent(p) + '&t=' + Date.now();
let S = {state: null, ch: localStorage.getItem('ch') || 'median-worker', video: null, detail: null, openJob: null};

async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function act(action, extra = {}) {
  const v = S.video || {};
  try {
    const r = await api('/api/action', Object.assign({action, channel: v.ch || S.ch, slug: v.slug}, extra));
    if (r.id) { S.openJob = r.id; seen[r.id] = 'running'; pollJobs(); }
    if (r.out) toast(r.out);
    if (r.slug) { location.hash = '#v/' + S.ch + '/' + r.slug + '/script'; }
    return r;
  } catch (e) { toast('Lỗi: ' + e.message); }
}
function toast(t) { const m = $('#jobview'); m.textContent = t; }
function copy(text, btn) { navigator.clipboard.writeText(text); if (btn) { const o = btn.textContent; btn.textContent = 'Đã copy'; setTimeout(() => btn.textContent = o, 1200); } }

// ---------------------------------------------------------------- state + routing
async function loadState() {
  S.state = await api('/api/state');
  const sel = $('#ch');
  sel.innerHTML = S.state.channels.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  if (!S.state.channels.some(c => c.id === S.ch)) { S.ch = S.state.channels[0].id; localStorage.setItem('ch', S.ch); }  // channel renamed or removed
  sel.value = S.ch;
}
$('#ch').onchange = e => { S.ch = e.target.value; localStorage.setItem('ch', S.ch); location.hash = '#board'; route(); };

function curChannel() {
  return (S.state && (S.state.channels.find(x => x.id === S.ch) || S.state.channels[0])) || {};
}
function isShortsCh(c) {
  return Boolean(c && (c.format === 'shorts' || c.aspect === '9:16'));
}
function syncNavLabels(shorts) {
  const map = shorts
    ? {script: 'Kịch bản & sử liệu', characters: 'Style & tham chiếu', shots: 'Phân cảnh, ảnh & Veo', voice: 'Giọng đọc (Vbee)', preview: 'Xem trước & dựng 9:16', upload: 'Ảnh bìa & đăng'}
    : {script: 'Kịch bản và nguồn', characters: 'Nhân vật và style', shots: 'Phân cảnh và ảnh', voice: 'Giọng đọc', preview: 'Xem trước và dựng', upload: 'Đăng'};
  document.querySelectorAll('nav a[data-t]').forEach(a => { if (map[a.dataset.t]) a.textContent = map[a.dataset.t]; });
}

async function route() {
  if (!S.state) await loadState();
  const h = location.hash.slice(1) || 'board';
  const p = h.split('/');
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('on'));
  if (p[0] === 'v') {
    S.video = {ch: p[1], slug: p[2]}; S.ch = p[1]; $('#ch').value = p[1];
    const tab = p[3] || 'script';
    S.detail = await api(`/api/video?channel=${p[1]}&slug=${p[2]}`);
    syncNavLabels(S.detail.is_shorts);
    $('#vlabel').textContent = 'Video đang mở: ' + p[2];
    document.querySelectorAll('nav a[data-t]').forEach(a => { a.href = `#v/${p[1]}/${p[2]}/${a.dataset.t}`; a.classList.remove('dis'); a.classList.toggle('on', a.dataset.t === tab); });
    $('#cscope').textContent = p[2];
    renderMsgs(S.detail.claude_history);
    renderGuide(tab);
    ({script: vScript, characters: vChars, shots: vShots, voice: vVoice, preview: vPreview, upload: vUpload}[tab] || vScript)();
  } else {
    S.video = null; $('#vlabel').textContent = 'Chưa mở video'; $('#guide').innerHTML = '';
    syncNavLabels(isShortsCh(curChannel()));
    document.querySelectorAll('nav a[data-t]').forEach(a => a.classList.add('dis'));
    const a = $(`nav a[data-r="${p[0]}"]`); if (a) a.classList.add('on');
    $('#cscope').textContent = 'cả workspace';
    api('/api/text?path=' + encodeURIComponent('dashboard/general/.dashboard/claude.jsonl')).then(t => renderMsgs(t.text.split('\n').filter(Boolean).map(l => JSON.parse(l)).slice(-30)));
    if (p[0] === 'topics') vTopics(); else vBoard();
  }
}
window.addEventListener('hashchange', route);

// ---------------------------------------------------------------- guided steps for one video
function renderGuide(tab) {
  const g = S.detail.guide, v = S.video;
  const cur = g.steps.find(x => x.key === g.next);
  const link = x => `#v/${v.ch}/${v.slug}/${x.tab}`;
  const its = S.detail.items || [], nNeed = its.filter(it => cls(it) === 'need').length, nBad = its.filter(it => cls(it) === 'bad').length, nWait = its.filter(it => cls(it) === 'wait').length;
  const flagged = its.filter(it => ['need', 'bad', 'wait'].includes(cls(it)) || clipState(it) === 'ask');
  const nAsk = its.filter(it => clipState(it) === 'ask').length;
  const warn = flagged.length && tab !== 'shots' ? `<div class="alert" role="alert"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><b style="color:var(--warn)">Cần bạn xử lý:</b> ${[nNeed && nNeed + ' ảnh quan trọng nên tạo trên Flow', nBad && nBad + ' ảnh lỗi hoặc nên làm lại', nWait && nWait + ' bảng nhân vật chờ duyệt', nAsk && nAsk + ' clip chờ duyệt'].filter(Boolean).join(' · ')}</div><a class="btn sm" href="${link({tab: 'shots'})}">Mở trang ảnh</a></div>
    <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap">${flagged.slice(0, 12).map(it => `<a href="${link({tab: 'shots'})}" data-gotolater="${esc(it.id)}" title="${esc(it.id)}: ${esc(clipState(it) === 'ask' ? clipText(it) : stateText(it))}" style="text-align:center;font:11px 'IBM Plex Mono',monospace;color:var(--ink2);text-decoration:none">${it.output ? `<img src="${file(it.output)}" alt="${esc(it.id)}" style="height:96px;border-radius:6px;display:block;margin-bottom:2px">` : `<div style="height:96px;width:54px;border:1px dashed var(--dash);border-radius:6px"></div>`}${esc(it.id)}</a>`).join('')}</div></div>` : '';
  setTimeout(() => document.querySelectorAll('[data-gotolater]').forEach(a => a.onclick = () => { S.gotoAfter = a.dataset.gotolater; }), 0);
  $('#guide').innerHTML = warn + `<div class="steps" role="navigation" aria-label="Các bước">${g.steps.map((x, i) => `<a href="${link(x)}" class="${x.done ? 'done' : ''} ${x.key === g.next ? 'cur' : ''} ${x.optional ? 'opt' : ''}" title="${esc(x.who)}: ${esc(x.hint)}"><span class="n">Bước ${i + 1}</span>${esc(x.label)}${x.done ? ' · xong' : x.optional ? ' · tùy chọn' : ''}</a>`).join('')}</div>
    ${cur ? `<div class="nextcard"><div><div class="who">Việc tiếp theo · người làm: ${esc(cur.who)}</div><b>${esc(cur.label)}</b><div class="muted">${esc(cur.hint)}</div></div>
      <div class="row">${S.detail.renders.length && tab !== 'preview' ? `<a class="btn" href="${link({tab: 'preview'})}">▶ Xem video đã dựng</a>` : ''}${optionalNow(g)}${cur.action && ['auto_video', 'auto_images', 'flow_clips'].includes(cur.action.action) && autoLock(S.detail) ? `<span class="chip running">⚙ Tự động đang chạy</span>` : cur.action ? `<button class="btn pri" data-gact='${esc(JSON.stringify(cur.action))}' data-busy="${esc(cur.action.action)}">${esc(cur.button)}</button>` : ''}
      ${tab !== cur.tab ? `<a class="btn" href="${link(cur)}">${cur.action ? 'Mở trang' : esc(cur.button)}</a>` : ''}</div></div>`
      : `<div class="nextcard"><b>Đã xong mọi bước. Kiểm lại trang ${S.detail.is_shorts ? 'Ảnh bìa & đăng' : 'Đăng'} rồi tải lên YouTube Studio / TikTok.</b>${S.detail.renders.length && tab !== 'preview' ? `<a class="btn" href="${link({tab: 'preview'})}">▶ Xem video đã dựng</a>` : ''}</div>`}`;
  document.querySelectorAll('[data-gact]').forEach(b => b.onclick = () => {
    const a = JSON.parse(b.dataset.gact);
    const big = {write_script: 'Claude sẽ viết toàn bộ kịch bản (tốn quota Claude, vài phút). Tiếp tục?', make_shots: 'Claude sẽ chia cảnh và tạo prompt (tốn quota Claude). Tiếp tục?'}[a.action];
    if (big && !confirm(big)) return;
    act(a.action, Object.assign({}, a, {model: $('#cmodel').value, effort: $('#ceffort').value}));
  });
}
function optionalNow(g) {  // optional steps that make sense right now (e.g. simulation once the script exists)
  return g.steps.filter(x => x.optional && !x.done && x.action && g.steps.findIndex(y => y.key === x.key) < g.steps.findIndex(y => y.key === g.next))
    .map(x => `<button class="btn" data-gact='${esc(JSON.stringify(x.action))}' data-busy="${esc(x.action.action)}">${esc(x.button)}</button>` +
      (x.extra ? `<button class="btn" data-gact='${esc(JSON.stringify({action: x.extra.action}))}' data-busy="${esc(x.extra.action)}">${esc(x.extra.button)}</button>` : '')).join('');
}

// one status class per image: need (owner must make it in Flow), bad (failed or Gemini says redo), wait (sheet waiting for approval), ok, todo
function cls(it) {
  if (it.route === 'compose') return it.output && it.state === 'approved' ? 'ok' : 'todo';  // made by the system, never by hand
  // bad = something still to fix: an image that failed, or scored below 4 and was not approved by the owner, or a hand-made clip
  // Gemini rejected (Flow clips are judged by their own stages and fallbacks, see clipState)
  const imgBad = it.review && it.review.score < 4 && !it.img_approved && !(it.flow && it.flow.stage === 'done');
  if (['failed', 'check_failed'].includes(it.state) || imgBad || (it.clip_review && !it.clip_review.ok && !it.flow)) return 'bad';
  if (S.detail && S.detail.is_shorts && (it.output || it.clip)) return 'ok';
  if (it.route === 'manual' && !(S.detail && S.detail.gflow) && !['done', 'approved'].includes(it.state) && !it.variants.length) return 'need';
  if (it.state === 'needs_approval') return 'wait';
  if (it.output) return 'ok';
  return 'todo';
}

    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const e = $('#ed-' + CSS.escape(b.dataset.edit)); e.hidden = !e.hidden; b.classList.toggle('pri', !e.hidden); });
    document.querySelectorAll('[data-saveshot]').forEach(b => b.onclick = async () => {
      const id = b.dataset.saveshot, it = items.find(x => x.id === id);
      let shot;
      try { shot = JSON.parse($('#js-' + CSS.escape(id)).value); } catch (e) { alert('JSON lỗi: ' + e.message); return; }
      if (JSON.stringify(shot) === JSON.stringify(it.shot)) {
        shot.prompt = $('#sc-' + CSS.escape(id)).value.trim();
        shot.veo_prompt = $('#vp-' + CSS.escape(id)).value.trim();
        shot.camera = $('#cam-' + CSS.escape(id)).value.trim();
        shot.motion_mode = $('#mm-' + CSS.escape(id)).value;
      }
      const r = await act('save_shot', {id, shot});
      if (r && !r.ok) alert(r.out); else { await route(); gotoItem(id); }
    });
    document.querySelectorAll('[data-claudeshot]').forEach(b => b.onclick = () => {
      const id = b.dataset.claudeshot, note = $('#note-' + CSS.escape(id)).value.trim();
      if (!note) { alert('Ghi nội dung muốn sửa trước, ví dụ: góc máy cận hơn vào mũi cọc bịt sắt'); return; }
      act('claude_shot', {id, note, model: $('#cmodel').value, effort: $('#ceffort').value});
    });
    const sendMedia = async (id, f, forceKind) => {
      const isVid = forceKind === 'clip' || (!forceKind && (f.type.startsWith('video/') || /\.(mp4|mov|webm)$/i.test(f.name)));
      const kind = isVid ? 'clip' : 'image';
      toast(`Đang tải ${kind === 'clip' ? 'clip Veo' : 'ảnh 9:16'} cho ${id}...`);
      const r = await fetch(`/api/upload?kind=${kind}&channel=${S.video.ch}&slug=${S.video.slug}&id=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});
      const j = await r.json(); toast(j.out || j.error); route();
    };
    document.querySelectorAll('[data-up]').forEach(inp => inp.onchange = () => inp.files[0] && sendMedia(inp.dataset.up, inp.files[0], 'image'));
    document.querySelectorAll('[data-upclip]').forEach(inp => inp.onchange = () => inp.files[0] && sendMedia(inp.dataset.upclip, inp.files[0], 'clip'));
    document.querySelectorAll('[data-drop],[data-dropclip]').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('drag'); };
      z.ondragleave = () => z.classList.remove('drag');
      z.ondrop = e => {
        e.preventDefault(); z.classList.remove('drag');
        if (e.dataTransfer.files[0]) sendMedia(z.dataset.drop || z.dataset.dropclip, e.dataTransfer.files[0]);
      };
    });
    return;
  }

  const n = k => items.filter(i => i.state === k).length;
  $('#view').innerHTML = `<div class="head"><div><h1>Phân cảnh và ảnh</h1><p class="sub">${items.length} ảnh: ${n('pending')} chờ tạo, ${n('needs_approval')} chờ duyệt, ${n('done') + n('approved')} xong, ${n('failed') + n('check_failed')} lỗi. Bảng nhân vật phải duyệt trước khi tạo cảnh.</p></div>
    <div class="row"><button class="btn" id="mk" data-busy="prompts">Tạo lại prompt</button><button class="btn" id="ck" data-busy="check_prompts">Kiểm prompt</button><button class="btn" id="rv" data-busy="review">Gemini kiểm ảnh</button><label class="muted" for="wk" style="font-size:12px" ${autoMissing(items) ? '' : 'hidden'}>Số luồng</label><select id="wk" class="pick" ${autoMissing(items) ? '' : 'hidden'}>${[1, 2, 3, 4, 5, 6].map(n => `<option ${n === (Number(localStorage.getItem('workers')) || 4) ? 'selected' : ''}>${n}</option>`).join('')}</select>${autoMissing(items) ? `<button class="btn pri" id="gen" data-busy="auto_images,generate" data-item="" title="Tạo, Gemini kiểm, tự làm lại ảnh 1–2 điểm (tối đa 2 lần); ảnh 3–4 điểm chờ bạn duyệt">Tạo ${autoMissing(items)} ảnh còn thiếu + tự kiểm (Gemini)</button>` : '<button class="btn" id="gen" disabled title="Mọi ảnh tự động đã có; ảnh lỗi thì dùng Sửa theo góp ý hoặc Tạo lại">Đã đủ ảnh tự động</button>'}</div></div>
    ${items.length ? '' : '<div class="card muted">Chưa có prompt. Cần images/cast.json + images/shots.json rồi bấm “Tạo lại prompt”, hoặc nhờ Claude chia cảnh.</div>'}
    ${shotAlerts(items)}
    ${items.length ? `<div class="jump" aria-label="Đi nhanh tới ảnh">${items.map(it => `<a href="#" data-goto="${esc(it.id)}" class="${cls(it)}" title="${esc(it.id)}: ${esc(stateText(it))}">${esc(it.id.replace('sheet_', 'S:').replace('cast_sheet', 'CAST'))}</a>`).join('')}</div>
    <div class="tabs" role="tablist">${[['all', 'Tất cả'], ['need', 'Cần bạn tạo tay'], ['bad', 'Lỗi / nên làm lại'], ['wait', 'Chờ duyệt'], ['todo', 'Chưa có ảnh'], ['ok', 'Xong']].map(([k, t]) => `<button type="button" role="tab" data-f="${k}" class="${(S.shotFilter || 'all') === k ? 'on' : ''}">${t} (${items.filter(it => k === 'all' || cls(it) === k || (k === 'todo' && !it.output && cls(it) !== 'need' && cls(it) !== 'bad')).length})</button>`).join('')}</div>` : ''}
    ${items.map(it => `<div class="card shot ${cls(it) === 'need' ? 'need' : ''}" id="it-${esc(it.id)}" data-cls="${cls(it)}" data-has="${it.output ? 1 : 0}">
      <div><div class="row"><span class="chip">${it.seq}</span><b>${esc(it.id)}</b><span class="chip ${it.state}">${it.state}</span><span class="muted">${esc(it.kind)}</span>
          ${cls(it) === 'need' ? `<span class="badge-need">BẮT BUỘC tạo tay trên Flow</span>${it.output ? '<div class="err" style="font-size:12px;margin-top:6px">Đã có một file ảnh ở đây nhưng chưa qua bước tải lên hoặc duyệt. Xem ảnh bên phải: đúng bản bạn tạo trên Flow thì bấm “Xác nhận ảnh này”, không thì kéo ảnh đúng vào.</div>' : ''}` : it.route === 'compose' ? '<span class="chip done">tự ghép từ model sheet: KHÔNG tạo trên Flow</span>' : `<span class="chip ${it.route === 'manual' ? 'needs_approval' : ''}">${it.route === 'manual' ? 'tạo tay: Flow, Pro' : 'tự động: agy'}</span>`}</div>
        ${it.route === 'compose' ? `<div style="font-size:12px;margin-top:8px;line-height:1.6">Ảnh này không bao giờ tạo bằng AI: hệ thống dán nguyên các model sheet đã duyệt (${it.refs.map(r => esc(r.split('/').pop())).join(', ')}) thành một ảnh, ngay khi sheet cuối cùng được duyệt. Muốn đổi nhân vật thì sửa và duyệt lại model sheet của nhân vật đó.</div>` : ''}
        ${it.route === 'manual' && !it.output ? `<div style="font-size:12px;margin-top:8px;line-height:1.6">1. Mở <a href="https://labs.google/fx/tools/flow" target="_blank" rel="noopener">Google Flow</a>, chọn Image, model <b>Nano Banana Pro</b>, tỉ lệ 16:9.<br>2. Thêm ảnh tham chiếu theo thứ tự: ${it.refs.length ? it.refs.map((r, k) => `<a href="${file(S.detail.dir + '/images/' + r)}" download>${k + 1}) ${esc(r.split('/').pop())}</a>`).join(', ') : 'không cần'}.<br>3. Dán prompt (nút Copy), tạo 2-4 bản, tải bản lớn nhất.<br>4. Kéo ảnh vào ô bên phải.</div>` : ''}
        ${it.vo ? `<p style="margin:8px 0">${esc(it.vo)}</p>` : ''}
        <div class="muted" style="font-size:12px">${it.route === 'compose' ? 'Ghép từ' : 'Đính kèm'}: ${it.refs.map(r => esc(r)).join(', ') || 'không'}</div>
        ${it.last_error ? `<div class="err" style="font-size:12px">${esc(it.last_error.slice(-200))}</div>` : ''}
        ${it.review ? `<div style="margin-top:8px"><span class="chip ${imgVerdict(it)[0]}">${imgVerdict(it)[1]}</span> <span class="muted" style="font-size:11px">kiểm lúc ${esc((it.review.at || '').slice(11))}</span>${it.review.problems.map(x => `<div class="${it.review.ok ? 'muted' : 'err'}" style="font-size:12px">${esc(x)}</div>`).join('')}</div>` : ''}</div>
      <div><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="muted">Prompt</span><span class="row" style="gap:6px">${it.shot ? `<button class="btn sm" data-edit="${esc(it.id)}">Sửa prompt</button>` : ''}<button class="btn sm" data-copy="${esc(it.id)}">Copy</button></span></div><pre>${esc(it.prompt)}</pre>
        ${it.shot ? `<div class="shotedit" id="ed-${esc(it.id)}" hidden style="margin-top:8px">
          <label class="muted" for="sc-${esc(it.id)}">Cảnh (mô tả hành động)</label><textarea id="sc-${esc(it.id)}" rows="3">${esc(it.shot.scene || '')}</textarea>
          <label class="muted" for="cam-${esc(it.id)}">Góc máy</label><input type="text" id="cam-${esc(it.id)}" value="${esc(it.shot.camera || '')}">
          <details style="margin-top:6px"><summary>Sửa toàn bộ cảnh (JSON: nhân vật, tư thế, biểu cảm, bối cảnh…)</summary><textarea id="js-${esc(it.id)}" rows="10" style="margin-top:6px">${esc(JSON.stringify(it.shot, null, 1))}</textarea></details>
          <div class="row" style="margin-top:8px"><button class="btn sm pri" data-saveshot="${esc(it.id)}">Lưu và tạo lại prompt</button>
            <span class="muted" style="font-size:12px">hoặc</span>
            <input type="text" id="note-${esc(it.id)}" placeholder="nhờ Claude: ví dụ PAY chạy mệt hơn, thêm ngọn lửa" style="flex:1;min-width:200px">
            <button class="btn sm" data-claudeshot="${esc(it.id)}" data-busy="claude">Claude viết lại</button></div>
          <p class="muted" style="font-size:12px;margin:6px 0 0">Style khóa cứng và thẻ nhân vật vẫn được chèn tự động. Sau khi lưu, bấm “Tạo lại” để có ảnh mới theo prompt mới.</p>
        </div>` : ''}</div>
      <div>${it.route === 'compose' ? `${it.output ? `<a href="${file(it.output)}" target="_blank"><img class="big" src="${file(it.output)}" alt="Ảnh ${esc(it.id)}"></a>` : '<div class="slot">Chưa đủ model sheet đã duyệt</div>'}
        <div class="row" style="margin-top:8px"><button class="btn sm" data-compose="1">Ghép lại từ các model sheet</button></div></div></div>` : `${it.output ? `<a href="${file(it.output)}" target="_blank"><img class="big" src="${file(it.output)}" alt="Ảnh ${esc(it.id)}"></a>` : `<div class="slot" data-drop="${esc(it.id)}">Thả ảnh tạo tay (Gemini app / Flow) vào đây</div>`}
        <div class="thumbs" style="margin-top:6px">${it.variants.map((v, k) => `<img src="${file(v.path)}" alt="Bản ${k + 1}" title="Bản ${k + 1}${v.problems && v.problems.length ? ': ' + esc(v.problems.join('; ')) : ''}" class="${it.chosen === k + 1 ? 'sel' : ''}" data-pick="${esc(it.id)}" data-v="${k + 1}">`).join('')}</div>
        <div class="row" style="margin-top:8px">
          ${it.review && !it.review.ok && !it.img_approved ? `<button class="btn sm pri" data-gen="${esc(it.id)}" data-busy="redo,auto_images,generate,redo_many" data-item="${esc(it.id)}" title="Tạo lại, kèm lỗi Gemini đã chỉ ra">Sửa theo góp ý</button>` : ''}
          <button class="btn sm ${it.route === 'manual' || (it.review && !it.review.ok) ? '' : 'pri'}" data-gen="${esc(it.id)}" data-busy="redo,auto_images,generate" data-item="${esc(it.id)}" title="${it.route === 'manual' ? 'Ảnh quan trọng: nên tạo tay trên Google Flow; nút này tạo nhanh bằng agy' : ''}">${it.variants.length ? 'Tạo lại (agy)' : 'Tạo (agy)'}</button>
          ${it.variants.length ? `<button class="btn sm" data-ok="${esc(it.id)}">${it.kind === 'scene' ? 'Dùng bản đã chọn' : 'Duyệt bảng này'}</button>` : ''}
          ${cls(it) === 'need' && it.output ? `<button class="btn sm pri" data-confirm="${esc(it.id)}">Xác nhận ảnh này</button>` : ''}
          <label class="btn sm">Tải ảnh lên<input type="file" accept="image/*" data-up="${esc(it.id)}" hidden></label>
          ${it.output && it.kind === 'scene' ? `<button class="btn sm" data-rv1="${esc(it.id)}" data-busy="review" data-item="${esc(it.id)}" title="Gemini so ảnh này với bảng nhân vật">Gemini kiểm ảnh này</button>` : ''}
          <button class="btn sm" data-ask="${esc(it.id)}">Nhờ Claude sửa</button></div></div></div>`}`).join('')}`;
  document.querySelectorAll('[data-compose]').forEach(b => b.onclick = async () => { const r = await act('compose'); if (r && !r.ok) alert(r.out); route(); });
  $('#mk').onclick = () => act('prompts');
  $('#ck').onclick = () => act('check_prompts');
  if (autoMissing(items)) $('#gen').onclick = () => act('auto_images', {workers: Number($('#wk').value)});
  bindDecisions();
  $('#wk').onchange = () => { try { localStorage.setItem('workers', $('#wk').value); } catch (e) {} };
  document.querySelectorAll('[data-goto]').forEach(a => a.onclick = e => { e.preventDefault(); gotoItem(a.dataset.goto); });
  const applyFilter = f => { S.shotFilter = f; document.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === f));
    document.querySelectorAll('.shot[data-cls]').forEach(c => { const k = c.dataset.cls;
      c.hidden = !(f === 'all' || k === f || (f === 'todo' && c.dataset.has === '0' && k !== 'need' && k !== 'bad')); }); };
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => applyFilter(b.dataset.f));
  applyFilter(S.shotFilter || 'all');
  $('#rv').onclick = () => act('review');
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(items.find(i => i.id === b.dataset.copy).prompt, b));
  document.querySelectorAll('[data-gen]').forEach(b => b.onclick = async () => { b.disabled = true; b.textContent = 'Đang làm lại…'; await act('redo', {id: b.dataset.gen}); route(); }); markQueued();
  document.querySelectorAll('[data-pick]').forEach(im => im.onclick = () => { document.querySelectorAll(`[data-pick="${im.dataset.pick}"]`).forEach(x => x.classList.remove('sel')); im.classList.add('sel'); });
  document.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => {
    const sel = document.querySelector(`[data-pick="${b.dataset.ok}"].sel`);
    await act('approve', {id: b.dataset.ok, variant: sel ? Number(sel.dataset.v) : undefined}); route();
  });
  document.querySelectorAll('[data-fixall]').forEach(b => b.onclick = () => {
    const ids = JSON.parse(b.dataset.fixall);
    if (confirm(`Tạo lại ${ids.length} ảnh, kèm lỗi Gemini đã chỉ ra cho từng ảnh? (chạy song song, quota Google)`)) act('redo_many', {ids});
  });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const e = $('#ed-' + CSS.escape(b.dataset.edit)); e.hidden = !e.hidden; b.classList.toggle('pri', !e.hidden); });
  document.querySelectorAll('[data-saveshot]').forEach(b => b.onclick = async () => {
    const id = b.dataset.saveshot, it = items.find(x => x.id === id);
    let shot;
    try { shot = JSON.parse($('#js-' + CSS.escape(id)).value); } catch (e) { alert('JSON lỗi: ' + e.message); return; }
    if (JSON.stringify(shot) === JSON.stringify(it.shot)) { shot.scene = $('#sc-' + CSS.escape(id)).value.trim(); shot.camera = $('#cam-' + CSS.escape(id)).value.trim(); }
    const r = await act('save_shot', {id, shot});
    if (r && !r.ok) alert(r.out); else { await route(); gotoItem(id); }
  });
  document.querySelectorAll('[data-claudeshot]').forEach(b => b.onclick = () => {
    const id = b.dataset.claudeshot, note = $('#note-' + CSS.escape(id)).value.trim();
    if (!note) { alert('Ghi muốn sửa gì trước, ví dụ: thêm ngọn lửa, ELDER ngồi thay vì đứng'); return; }
    act('claude_shot', {id, note, model: $('#cmodel').value, effort: $('#ceffort').value});
  });
  document.querySelectorAll('[data-rv1]').forEach(b => b.onclick = () => act('review', {only: [b.dataset.rv1]}));
  document.querySelectorAll('[data-confirm]').forEach(b => b.onclick = async () => { await act('confirm', {id: b.dataset.confirm}); route(); });
  document.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => { $('#cmsg').value = `Cảnh/ảnh ${b.dataset.ask}: `; $('#cmsg').focus(); });
  const send = async (id, f) => { const r = await fetch(`/api/upload?kind=image&channel=${S.video.ch}&slug=${S.video.slug}&id=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f}); const j = await r.json(); toast(j.out || j.error); route(); };
  document.querySelectorAll('[data-up]').forEach(inp => inp.onchange = () => inp.files[0] && send(inp.dataset.up, inp.files[0]));
  document.querySelectorAll('[data-drop]').forEach(z => {
    z.ondragover = e => { e.preventDefault(); z.classList.add('drag'); };
    z.ondragleave = () => z.classList.remove('drag');
    z.ondrop = e => { e.preventDefault(); z.classList.remove('drag'); if (e.dataTransfer.files[0]) send(z.dataset.drop, e.dataTransfer.files[0]); };
  });
}

        <td><button class="btn sm" data-c="${v.n}">Copy text</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Chưa có. Bấm “Tạo lại text giọng” sau khi xong kịch bản.</td></tr>'}</tbody></table></div>`;
  $('#vt').onclick = () => act('voice_text');
  $('#opentts').onclick = () => act('open_tts');
  $('#imptts').onclick = async () => {
    const r = await act('import_tts');
    if (!r || !r.got) return;
    if (!r.got.length) { toast(r.out); alert(r.out); return; }
    if (confirm(r.out + '\n\nChép vào audio/ của video này? File mp3 cũ cùng số sẽ bị thay.')) { const x = await act('import_tts', {apply: true}); route(); }
  };
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => copy(d.voice.find(v => v.n === b.dataset.c).text, b));
  const z = $('#drop');
  z.ondragover = e => { e.preventDefault(); z.classList.add('drag'); };
  z.ondragleave = () => z.classList.remove('drag');
  z.ondrop = async e => { e.preventDefault(); z.classList.remove('drag');

}

              <div class="row" style="margin-top:4px">
                <select id="cbg" class="pick" style="min-height:36px;flex:1;min-width:220px">
                  <option value="">${sc.cover_bg ? 'Giữ ảnh nền hiện tại (packaging/cover_frame.png)' : (frames.length ? 'Tự chọn cảnh cuối cùng đã tạo' : 'Chưa có ảnh cảnh — hãy tải ảnh nền lên')}</option>
                  ${frames.map(f => `<option value="${esc(f.output)}">${esc(f.id)} — ${esc((f.vo || '').slice(0, 55))}</option>`).join('')}
                </select>
                <label class="btn">Tải ảnh nền 9:16 lên<input type="file" accept="image/*" id="upcbg" hidden></label>
              </div>
            </div>
            <div class="row" style="margin-top:14px">
              <button class="btn pri" id="mkcov" data-busy="make_cover">Tạo ảnh bìa 1080×1920</button>
              <span class="muted" style="font-size:12px">Lưu tại <span class="mono">packaging/cover_1080x1920.png</span> (gắn trên app YouTube điện thoại &amp; TikTok).</span>
            </div>
          </div>
        </div>
      </div>
      ${d.upload.map((s, k) => `<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(s.name)}</h2><button class="btn sm" data-u="${k}">Copy</button></div><pre style="max-height:420px">${esc(s.text)}</pre></div>`).join('')
        || '<div class="card muted">Chưa có packaging/youtube.txt. Bấm “Claude viết tiêu đề & mô tả” trên thanh hướng dẫn.</div>'}
      <details class="card"><summary>Sửa trực tiếp packaging/youtube.txt</summary>
        <textarea id="yttxt" rows="18" style="margin-top:8px">${esc(d.youtube_txt || '')}</textarea>
        <div class="row" style="margin-top:8px"><button class="btn pri" id="svyt">Lưu packaging/youtube.txt</button></div></details>`;
    $('#tt').onclick = () => act('titles');
    $('#mkcov').onclick = async () => {  // show the new cover (and its download button) as soon as it is made
      const r = await act('make_cover', {line1: $('#cl1').value.trim(), line2: $('#cl2').value.trim(), bg: $('#cbg').value});
      if (r && !r.id) route();
    };
    $('#upcbg').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      toast('Đang tải ảnh nền bìa...');
      const r = await fetch(`/api/upload?kind=cover_bg&channel=${S.video.ch}&slug=${S.video.slug}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});
      const j = await r.json(); toast(j.out || j.error); route();
    };
    $('#svyt').onclick = async () => {
      await api('/api/save', {channel: S.video.ch, slug: S.video.slug, what: 'youtube', text: $('#yttxt').value});
      toast('Đã lưu packaging/youtube.txt'); route();
    };
    document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => copy(d.upload[b.dataset.u].text, b));
    document.querySelectorAll('[data-finder]').forEach(b => b.onclick = () => act('open_render', {path: b.dataset.finder, finder: true}));
    return;
  }

  const vid = d.renders[0];
  $('#view').innerHTML = `<div class="head"><div><h1>Đăng</h1><p class="sub">Copy từng mục sang YouTube Studio theo thứ tự.</p></div></div>
    <div class="card"><h2>File để tải lên Studio</h2>
      ${vid ? `<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div><b>Video</b> <span class="mono">${esc(vid.name)}</span> <span class="muted">· ${vid.mb} MB · dựng lúc ${esc(vid.at)}</span></div>
        <button class="btn sm" data-finder="${esc(vid.path)}">Hiện trong Finder</button></div>` : '<p class="muted">Chưa có video. Dựng ở tab Xem trước.</p>'}
      ${d.thumbs.map(t => `<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:8px"><div><b>Thumbnail</b> <span class="mono">${esc(t.split('/').pop())}</span></div>
        <button class="btn sm" data-finder="${esc(t)}">Hiện trong Finder</button></div>`).join('')}</div>
    ${d.upload.map((s, k) => `<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(s.name)}</h2><button class="btn sm" data-u="${k}">Copy</button></div><pre style="max-height:420px">${esc(s.text)}</pre></div>`).join('') || '<div class="card muted">Chưa có upload/upload.txt. Nhờ Claude viết tiêu đề, mô tả và tag.</div>'}
    <div class="card"><div class="row" style="justify-content:space-between"><h2>Thumbnail</h2><button class="btn" id="tt" data-busy="titles">Gemini nháp tiêu đề, thumbnail, tag</button></div>
      ${d.thumbs.map(t => `<div class="muted">Đang dùng:</div><img src="${file(t)}" alt="thumbnail đang dùng" style="width:420px;border-radius:8px">`).join('') || '<p class="muted">Chưa chọn thumbnail.</p>'}
      <p class="muted" style="margin:10px 0 4px">Bản cuối nên tạo tay trên <a href="https://labs.google/fx/tools/flow" target="_blank" rel="noopener">Google Flow</a> (Nano Banana Pro) từ ý tưởng tốt nhất bên dưới, rồi tải lên. Nút Gemini tạo thumbnail dùng để thử ý tưởng nhanh.</p>
      <label class="btn">Tải thumbnail lên<input type="file" accept="image/*" id="upth" hidden></label>
      <div class="grid" style="grid-template-columns:2fr 1fr auto;margin-top:12px;align-items:end">
        <div><label for="tc" class="muted">Ý tưởng hình (dùng TÊN nhân vật viết hoa)</label><input type="text" id="tc" placeholder="WORKER looks shocked as a giant blank rent bill towers over him"></div>
        <div><label for="tx" class="muted">Chữ to (tối đa 4 từ, code vẽ)</label><input type="text" id="tx" placeholder="RENT ATE 30%"></div>
        <button class="btn pri" id="mkth" data-busy="thumb">Gemini tạo thumbnail</button></div>
      <div class="thumbs" style="margin-top:12px">${d.thumb_candidates.map(t => `<figure style="margin:0"><img src="${file(t)}" alt="${esc(t)}" style="width:300px"><figcaption><button class="btn sm" data-useth="${esc(t)}">Dùng ảnh này</button></figcaption></figure>`).join('')}</div></div>`;
  $('#tt').onclick = () => act('titles');
  $('#upth').onchange = async e => { const f = e.target.files[0]; if (!f) return; await fetch(`/api/upload?kind=thumbnail&channel=${S.video.ch}&slug=${S.video.slug}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f}); route(); };
  $('#mkth').onclick = () => act('thumb', {concept: $('#tc').value, text: $('#tx').value});
  document.querySelectorAll('[data-useth]').forEach(b => b.onclick = async () => { await act('use_thumb', {path: b.dataset.useth}); route(); });
  document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => copy(d.upload[b.dataset.u].text, b));
  document.querySelectorAll('[data-finder]').forEach(b => b.onclick = () => act('open_render', {path: b.dataset.finder, finder: true}));
}

// ---------------------------------------------------------------- claude + jobs dock
function renderMsgs(h) {
  $('#msgs').innerHTML = (h || []).map(m => `<div class="msg ${m.role}">${m.role !== 'owner' ? `<span class="who">${m.role === 'gemini' ? 'Gemini' : 'Claude'}</span>` : ''}${esc(m.text)}</div>`).join('') || '<div class="muted">Gõ yêu cầu bằng tiếng Việt. Gemini: tìm và nghiên cứu (quota Google). Claude: phần cần chính xác và kỹ thuật (quota Claude).</div>';
  $('#msgs').scrollTop = 1e9;
}
$('#cform').onsubmit = async e => {
  e.preventDefault();
  const who = (e.submitter && e.submitter.dataset.who) || 'claude';
  const m = $('#cmsg').value.trim(); if (!m) return;
  $('#cmsg').value = '';
  $('#msgs').insertAdjacentHTML('beforeend', `<div class="msg owner">${who === 'gemini' ? '[Gemini] ' : ''}${esc(m)}</div>`);
  await act(who, {message: m, model: $('#cmodel').value, effort: $('#ceffort').value, gmodel: $('#gmodel').value});
};
['cmodel', 'ceffort', 'gmodel'].forEach(id => { const el = $('#' + id); try { const v = localStorage.getItem(id); if (v !== null) el.value = v; } catch (e) {} el.onchange = () => { try { localStorage.setItem(id, el.value); } catch (e) {} }; });
$('#cmsg').onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('#cform').requestSubmit($('[data-who=claude]')); };

let polling = null, lastRunning = 0, seen = {};
const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
function scopeTag() { return S.video ? S.video.ch + '/' + S.video.slug : null; }
function markBusy(jobs) {
  const run = jobs.filter(j => j.status === 'running');
  const now = Date.now() / 1000;
  document.querySelectorAll('[data-busy]').forEach(b => {
    const acts = b.dataset.busy.split(',');
    const j = run.find(x => acts.includes(x.action) && (x.video === scopeTag() || !x.video || ['scout', 'suggest_phrases', 'competitors'].includes(x.action))
      && (b.dataset.item === undefined || (b.dataset.item === '' ? !x.item : (x.item || '').split(',').includes(b.dataset.item))));
    if (!b.dataset.label) b.dataset.label = b.textContent;
    if (j) { b.disabled = true; b.classList.add('busy'); b.textContent = ' Đang chạy ' + fmt(now - j.started); }
    else if (b.classList.contains('busy')) { b.disabled = false; b.classList.remove('busy'); b.textContent = b.dataset.label; }
  });
  $('#runbar').innerHTML = run.length ? `<div class="bar">${run.map(j => `<span><span class="spin"></span>${esc(j.label)} · ${fmt(now - j.started)}</span>`).join('')}</div>` : '';
}
function notify(j) {
  const el = document.createElement('div');
  el.className = 'toast' + (j.status === 'done' ? '' : ' bad');
  el.textContent = (j.status === 'done' ? 'Xong: ' : j.status === 'stopped' ? 'Đã dừng: ' : 'Lỗi: ') + j.label;
  const watch = j.kind === 'render' && j.status === 'done' && j.video;
  if (watch) { const a = document.createElement('a'); a.href = '#v/' + j.video + '/preview'; a.textContent = ' ▶ Xem video'; a.style.fontWeight = '600'; a.onclick = () => el.remove(); el.appendChild(a); }
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), watch ? 60000 : 7000);
}
async function pollJobs() {
  clearTimeout(polling);
  const st = await api('/api/state'); S.state = st;
  const jobs = st.jobs;
  const running = jobs.filter(j => j.status === 'running').length;
  let renderEnded = false;
  let mineEnded = false;  // a job of the open video finished: refresh its page so new files (cover, clips, renders) show up
  jobs.forEach(j => { if (seen[j.id] === 'running' && j.status !== 'running') { notify(j); renderEnded = renderEnded || j.kind === 'render';
    mineEnded = mineEnded || (S.video && j.video === S.video.ch + '/' + S.video.slug); } seen[j.id] = j.status; });
  const typing = document.activeElement && ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement.tagName);
  if (mineEnded && !typing && S.video && !(renderEnded && running)) setTimeout(() => route(), 300);
  markBusy(jobs);
  // while this video's runner works, refresh the image page when something changed (new image, review, queue)
  if (S.video && !typing && /\/shots$/.test(location.hash) && jobs.some(j => j.status === 'running' && j.video === S.video.ch + '/' + S.video.slug)
      && Date.now() - (S.lastSigAt || 0) > 15000) {
    S.lastSigAt = Date.now();
    const d = await api(`/api/video?channel=${encodeURIComponent(S.video.ch)}&slug=${encodeURIComponent(S.video.slug)}`);
    const sig = JSON.stringify([(d.items || []).map(i => [i.id, i.state, i.output, i.review && i.review.score, i.flow && i.flow.stage, i.flow && i.flow.status]), d.auto]);
    if (S.sig && sig !== S.sig) { const y = window.scrollY; await route(); window.scrollTo(0, y); }
    S.sig = sig;
  }
  $('#jcount').textContent = running ? running + ' đang chạy' : '';
  $('#jobs').innerHTML = jobs.slice(0, 6).map(j => `<div class="job" data-j="${j.id}"><span class="chip ${j.status}">${j.status}</span><span>${esc(j.label)}</span>${j.status === 'running' ? `<button class="btn sm" data-stop="${j.id}">Dừng</button>` : ''}</div>`).join('') || '<div class="muted">Chưa có việc nào.</div>';
  document.querySelectorAll('[data-j]').forEach(el => el.onclick = () => { S.openJob = el.dataset.j; pollJobs(); });
  document.querySelectorAll('[data-stop]').forEach(b => b.onclick = ev => { ev.stopPropagation(); act('stop', {job: b.dataset.stop}); });
  if (S.openJob) {
    const j = await api('/api/job?id=' + S.openJob);
    $('#jobview').textContent = j.text.split('\n').slice(-40).join('\n');
    if ((j.kind === 'claude' || j.kind === 'gemini') && j.status === 'running') {
      const last = j.text.split('\n').filter(l => l && !l.startsWith('$')).slice(-1)[0] || '…';
      let live = $('#live'); if (!live) { $('#msgs').insertAdjacentHTML('beforeend', '<div class="msg" id="live"></div>'); live = $('#live'); }
      live.textContent = (j.kind === 'gemini' ? 'Gemini đang làm…' : 'Claude đang làm: ' + last.slice(0, 200)); $('#msgs').scrollTop = 1e9;
    }
  }
  if (S.fillPhrases) { const fj = jobs.find(j => j.id === S.fillPhrases);
    if (fj && fj.status !== 'running') { S.fillPhrases = null;
      if (fj.result_file) { const t = await api('/api/text?path=' + encodeURIComponent(fj.result_file)); if ($('#ph')) $('#ph').value = t.text.trim(); } } }
  if (renderEnded && running && !$('#ph')) route();  // show the new video even while other jobs still run
  if (lastRunning && !running) { const live = $('#live'); if (live) live.remove(); if (!$('#ph')) route(); }
  lastRunning = running;
  polling = setTimeout(pollJobs, running ? 1000 : 6000);
}

(function () {
  const set = vh => { vh = Math.max(15, Math.min(85, vh)); document.documentElement.style.setProperty('--dockh', vh + 'vh'); try { localStorage.setItem('dockh', vh); } catch (e) {} };
  let v = 42; try { v = Number(localStorage.getItem('dockh')) || 42; } catch (e) {}
  set(v);
  document.querySelectorAll('[data-dh]').forEach(b => b.onclick = () => set(Number(b.dataset.dh)));
  const g = document.getElementById('grip');
  g.onmousedown = e => { e.preventDefault();
    const move = ev => set(100 * (window.innerHeight - ev.clientY) / window.innerHeight);
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up); };
})();
(function () {
  const b = document.getElementById('totop');
  const upd = () => b.classList.toggle('show', window.scrollY > 600);
  window.addEventListener('scroll', upd, {passive: true});
  b.onclick = () => window.scrollTo({top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  document.addEventListener('keydown', e => { if (e.key === 'Home' && e.altKey) b.click(); });
})();
route().then(pollJobs);
window.addEventListener('hashchange', () => setTimeout(() => S.state && markBusy(S.state.jobs), 300));
</script>
</body>
</html>
