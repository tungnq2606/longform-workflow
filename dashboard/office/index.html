<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · Văn phòng 3D</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/office/css/fonts.css">
<link rel="stylesheet" href="/office/css/office.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.min.js",
    "three/addons/": "/vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="app" aria-label="Văn phòng 3D: khuôn viên sản xuất video với các phòng ban và nhân sự đang làm việc"></div>

<!-- Top-Left Floating Double-Bezel Island -->
<header id="top-left" class="bezel-shell">
  <div class="bezel-core">
    <div class="brand-mark">
      <span class="brand-badge">3D</span>
      <span>Studio Văn Phòng</span>
    </div>
    <div class="divider-v"></div>
    <div class="field-group">
      <label class="field-label" for="ch">Kênh</label>
      <select id="ch" aria-label="Chọn kênh YouTube"></select>
    </div>
    <div class="divider-v"></div>
    <span id="run-status" aria-live="polite"><span class="status-pulse"></span>Đang tải...</span>
  </div>
</header>

<!-- Top-Right Action & Atmosphere Island -->
<nav id="top-right" class="bezel-shell" aria-label="Điều khiển góc nhìn và giao diện">
  <div class="bezel-core">
    <button id="home-btn" title="Đưa góc nhìn về toàn cảnh khuôn viên">Toàn cảnh</button>
    <button id="handoff-btn" title="Gửi nhân viên chuyển tập hồ sơ sang phòng kế tiếp">Chuyển hồ sơ</button>
    <button id="atmo-btn" title="Đổi ánh sáng môi trường: Ban ngày, Hoàng hôn, Ban đêm">Ban ngày</button>
    <button id="zen-btn" title="Ẩn các bảng phụ để trưng bày văn phòng 3D">Trưng bày</button>
    <button id="drawer-btn" title="Đóng hoặc mở bảng thông tin bên phải">Chi tiết</button>
    <a class="btn pri" href="/">Bảng điều khiển <span class="btn-trail">↗</span></a>
  </div>
</nav>

<!-- Bottom-Center Department Quick-Jump Dock -->
<nav id="stage-dock" class="bezel-shell" aria-label="Chuyển nhanh tới từng phòng ban">
  <div id="stage-dock-core" class="bezel-core"></div>
</nav>

<!-- Bottom-Left Live Activity & Role Legend -->
<section id="feed-shell" class="bezel-shell" aria-label="Nhật ký hoạt động">
  <div class="bezel-core">
    <div class="feed-header">
      <span class="feed-title">Hoạt động gần đây</span>
      <div class="role-legend">
        <span class="role-tag"><i class="role-swatch" style="background:var(--owner)"></i>Bạn</span>
        <span class="role-tag"><i class="role-swatch" style="background:var(--claude)"></i>Claude</span>
        <span class="role-tag"><i class="role-swatch" style="background:var(--gemini)"></i>Gemini</span>
        <span class="role-tag"><i class="role-swatch" style="background:var(--code)"></i>Máy</span>
      </div>
    </div>
    <div id="feed-list"></div>
  </div>
</section>

<!-- Right Inspector Drawer -->
<aside id="panel-shell" class="bezel-shell" aria-live="polite">
  <div id="panel-core" class="bezel-core"></div>
</aside>

<!-- Minimal Hover Tooltip -->
<div id="hover-card" role="status" aria-hidden="true"></div>

<!-- Quick Task Dispatch Modal (Opened on Double-Clicking a Staff Member or clicking Giao việc) -->
<div id="dispatch-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="dispatch-title">
  <div id="dispatch-modal" class="bezel-shell">
    <div id="dispatch-core" class="bezel-core"></div>
  </div>
</div>

<script type="module" src="/office/js/main.js"></script>
</body>
</html>
